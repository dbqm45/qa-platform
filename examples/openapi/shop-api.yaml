# OpenAPI contract of the Example Shop API (examples/app/shop_app.py).
# Paths are relative to the environment's "api" service URL.
# Used by: qa test --scenario api.feature --mode contract
openapi: 3.1.0
info:
  title: Example Shop API
  version: "1"
paths:
  /health:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: ok}
  /login:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [token, name]
                additionalProperties: false
                properties:
                  token: {type: string, minLength: 1}
                  name: {type: string}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /orders:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items: {$ref: "#/components/schemas/Order"}
        "401": {$ref: "#/components/responses/Error"}
    post:
      responses:
        "201":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "401": {$ref: "#/components/responses/Error"}
        "422":
          content:
            application/json:
              schema:
                type: object
                required: [errors]
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items: {type: string}
  /reset:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {const: reset}
components:
  schemas:
    Order:
      type: object
      required: [id, user, product, quantity, total]
      additionalProperties: false
      properties:
        id: {type: integer, minimum: 1}
        user: {type: string}
        product: {enum: [apple, pear, plum]}
        quantity: {type: integer, minimum: 1, maximum: 10}
        total: {type: number, minimum: 0}
  responses:
    Error:
      description: An error with a message.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
