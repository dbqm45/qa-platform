# Example project configuration. Paths are relative to this file's directory.
# Never put credentials here: unknown fields and URLs with user:password are rejected.
version: 1

project:
  id: shop
  name: Example Shop
  scenario_dir: scenarios
  default_environment: local

  repositories:
    - name: web
      path: ../../shop-web          # local checkout, read-only for the platform
    - name: api
      url: https://example.com/org/shop-api

  environments:
    - name: local                        # examples/app/shop_app.py
      base_url: http://localhost:8000
      services:
        api: http://localhost:8000/api
      timeout_seconds: 10                # how long assertions wait before failing
    - name: staging
      base_url: https://staging.example.com
      services:
        api: https://api.staging.example.com
      timeout_seconds: 60
      # variables:                       # plain values for ${NAME} in scenarios
      #   SHOP_USER: qa-bot
      # headers:                         # sent with every API request
      #   X-Api-Key: ${SHOP_API_KEY}     # secrets only as ${NAME} references
