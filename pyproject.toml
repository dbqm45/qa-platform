[project]
name = "qa-platform"
version = "0.1.0"
description = "Local-first, deterministic QA automation platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# No build backend yet — packages are added in TASK-004.
package = false

# --- Ruff: linting and formatting -----------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"

# --- mypy: static type checking -------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["tests"]
warn_unreachable = true
pretty = true

# --- pytest ---------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
